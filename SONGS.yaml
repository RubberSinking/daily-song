songs:
  - title: "Stay"
    artist: "Lisa Loeb"
    description: "About wanting someone to stay despite mixed signals and confusion in a relationship; intimate mid-1990s acoustic pop with a close-miked female lead vocal that sounds thoughtful, vulnerable, and conversational rather than showy; the arrangement is built around steady, lightly syncopated strummed acoustic guitar with crisp attack, subtle electric bass, light live drums or brushed percussion, and occasional understated electric guitar textures that never overpower the voice; the melody moves like natural speech turned musical, with memorable hook phrases that feel emotionally urgent but never melodramatic; the harmonic mood is wistful, unresolved, and gently bittersweet, giving the impression of someone thinking in real time through love, confusion, and mixed signals; verses should feel like a private late-night conversation, while the chorus opens slightly wider without becoming huge, preserving emotional closeness; lyrics should be first-person, specific, plainspoken, and quietly devastating, full of ordinary phrases that carry emotional weight; overall effect: literate, confessional, jangly-acoustic, emotionally restrained but piercing, radio-friendly without losing fragility."
  - title: "I Do"
    artist: "Lisa Loeb"
    description: "About the quiet decision to commit to someone through everyday devotion; warm, melodic singer-songwriter pop with bright acoustic rhythm guitar, lightly jangling electric guitar accents, supportive bass, and clean mid-tempo live drums that feel buoyant rather than aggressive; lead vocal should be feminine, clear, affectionate, slightly breathy, and emotionally sincere, with a smile audible in some lines; the song structure should lean pop-forward with a catchy, immediate chorus and verses that feel breezy and observant, balancing sweetness with self-awareness; harmonically it should live in a major-key emotional world with touches of wistfulness, capturing romantic hopefulness without becoming saccharine; lyrics should describe devotion through concrete everyday details, using direct language, earnest phrasing, and a sense of quietly chosen commitment; production should sound polished but organic, as if recorded by a smart 1990s pop-rock band that values melody, clarity, and emotional accessibility."
  - title: "Bring Me Up"
    artist: "Lisa Loeb"
    description: "About wanting reassurance, grounding, or emotional rescue from a trusted person; energetic late-1990s pop-rock with a female lead vocal that sounds alert, bright, and emotionally transparent; foundation should be driving acoustic guitar reinforced by punchy electric guitars, melodic bass, and tight live drums with crisp snare and a forward-moving groove; verses should carry a restless upward momentum and the chorus should feel uplifting, hooky, and slightly anthemic without entering arena-rock territory; melodic writing should balance conversational phrasing with strong singable lifts, giving the impression of being emotionally pulled upward out of doubt; lyrics should center on wanting reassurance, grounding, rescue, or emotional elevation from a trusted relationship, expressed with simple vivid language and a sense of motion; production should feel clean, guitar-led, and 1990s radio-friendly, mixing vulnerability with optimism and kinetic energy."
  - title: "Underdog"
    artist: "Lisa Loeb"
    description: "About standing up for and allied with the overlooked, awkward, or underestimated person; confident guitar-pop with a witty, observant female narrator, built from crisp strummed acoustic guitar, jangly electric fills, agile bass movement, and live drums that bounce rather than pound; the song should feel like a smart mid-1990s alternative-pop single with a slightly mischievous grin, where the vocal stays warm and personable even when the lyrics are sharp; verses should tell a small social story with clever detail, while the chorus lands as a memorable statement of allegiance to the overlooked, awkward, or underestimated person; harmony and melody should be catchy but lightly quirky, avoiding generic stadium shapes in favor of nimble phrasing and subtle emotional turns; lyrics should combine empathy, irony, and affection, making the singer sound perceptive and human; overall the arrangement should be nimble, guitar-driven, and hooky, with literate songwriting and approachable charm."
  - title: "She's Falling Apart"
    artist: "Lisa Loeb"
    description: "About watching someone you care about quietly unravel emotionally; tender melancholy singer-songwriter pop centered on a close, emotionally revealing female voice and an arrangement that leaves plenty of air around the lyric; use acoustic guitar as the spine, with restrained bass, sparse drums or percussion, and soft electric or keyboard colors entering only where they deepen the ache; the melodic contour should feel inward and descending at times, as though the song is watching a quiet unraveling up close rather than dramatizing it from afar; lyrics should portray emotional strain, loneliness, and private collapse through concrete images and compassionate observation, avoiding cliches in favor of intimate detail; chorus should expand slightly but remain fragile, never shouting, with emotional intensity coming from honesty rather than volume; the production should feel dimly lit, sympathetic, and human, preserving the sense of a diary entry turned into a beautifully shaped pop song."
  - title: "How"
    artist: "Lisa Loeb"
    description: "About trying to understand love, distance, or disconnection through honest self-questioning; reflective, mid-tempo acoustic alternative pop with a searching female vocal delivery that sounds intelligent, wounded, and fully present in the question the song is asking; instrumentation should begin from strummed acoustic guitar and bloom into tasteful electric textures, rounded bass, and restrained drums that create momentum without crowding the lyric; the song should feel harmonically unsettled in a graceful way, using chord changes that mirror emotional uncertainty and longing; lyrics should revolve around trying to understand love, distance, or disconnection, built from direct questions, small emotional contradictions, and plain language that grows more affecting the more specific it becomes; chorus should feel like a sincere reaching gesture rather than a giant release, preserving intimacy; overall sound should be literate, wistful, and gently radio-ready, with a 1990s alt-pop balance of polish and vulnerability."
  - title: "Wishing Heart"
    artist: "Lisa Loeb"
    description: "About tender yearning and protecting a private hope from disappointment; gentle romantic acoustic pop with a soft but articulate female lead vocal, delicate strummed guitar patterns, light percussion, melodic bass, and subtle shimmer from electric guitar or keys; the emotional center should be hopeful yearning, as if the singer is holding onto a private wish and protecting it from disappointment; melody should be graceful, immediately hummable, and shaped like natural speech lifted by longing; lyrics should focus on desire, hope, and the tension between imagination and reality, using tender everyday imagery rather than grand abstractions; the chorus should feel like the heart opening a little wider, warm and memorable but still personal; overall production should be clean, luminous, and emotionally sincere, with the feel of a thoughtful 1990s singer-songwriter pop track that trusts melody and understatement."
  - title: "Falling In Love"
    artist: "Lisa Loeb"
    description: "About the fragile, surprised realization that love has arrived; softly radiant pop ballad with intimate female vocals, lightly shimmering acoustic guitar, supportive bass, brushed or restrained live drums, and unobtrusive electric textures that create lift without losing closeness; the song should capture the fragile exhilaration of realizing one is falling in love, mixing nervousness, wonder, and emotional clarity; melodic writing should feel conversational in the verses and more open in the chorus, with a memorable refrain that lands like an admission rather than a declaration to a crowd; lyrics should use simple, believable language and small sensory observations to show affection arriving almost by surprise; the arrangement should stay elegant and uncluttered, letting the vocal and lyric carry the emotional truth; overall effect should be warm, sincere, romantic, and quietly glowing, like a private realization set to polished 1990s acoustic pop."
  - title: "Torn"
    artist: "Natalie Imbruglia"
    description: "About disillusionment and embarrassment after realizing you idealize someone who does not deserve it; polished late-1990s pop-rock with a female lead vocal that combines cool composure, emotional bruising, and sharp melodic clarity; arrangement should feature clean to lightly crunchy electric guitars, brisk acoustic strumming underneath, melodic bass, tight live drums with a firm backbeat, and sleek modern-pop production that still feels band-based; verses should sound exposed and reflective, while the chorus blooms into a high-contrast hook that feels cathartic, frustrated, and instantly memorable; harmonic language should balance melancholy and propulsion, making heartbreak feel kinetic rather than static; lyrics should capture disillusionment after idealization, using vivid but accessible phrases that express embarrassment, anger, and emptiness all at once; the emotional posture is wounded but lucid, with no self-pity, and the production should sound radio-ready, dynamic, and sharply arranged, like a breakup song you can sing loudly in the car."
  - title: "Don't Know Why"
    artist: "Norah Jones"
    description: "About regret and longing for a missed chance that you let slip away; intimate, late-night piano-jazz-pop ballad with a warm, smoky female vocal delivered with extreme softness, control, and emotional understatement; arrangement should center on gently played piano, brushed drums, upright or rounded acoustic bass, delicate guitar fills, and subtle organ or room ambience, all performed with unhurried restraint; the tempo should feel easy and floating, with a touch of swing but mostly a relaxed singer-songwriter pulse; melody should be simple, elegant, and wistful, unfolding like private thought rather than vocal showmanship; lyrics should express regret, longing, and quiet self-questioning through plain but evocative lines, giving the sense of someone sitting alone after midnight replaying a missed chance; the song should feel classy, intimate, autumnal, and timeless, with space, breath, and emotional maturity carrying more weight than volume or drama."
  - title: "Come Away with Me"
    artist: "Norah Jones"
    description: "About gently inviting someone to escape everyday life and find closeness together; tender, understated invitation-song blending jazz-pop, folk, and soft country colors, led by a hushed female vocal that feels close enough to whisper directly into the listener's ear; instrumentation should be sparse and organic, with soft piano, brushed drums, mellow acoustic or clean electric guitar, warm bass, and perhaps a subtle pedal steel or gentle atmospheric texture; the rhythm should be slow and swaying, more like a quiet nighttime walk than a formal pop groove; melodic writing should be graceful, uncluttered, and lullaby-adjacent, allowing the lyric to feel natural and intimate; lyrics should offer escape, closeness, and companionship through gentle imagery of travel, weather, rooms, and shared quiet, never overexplaining emotion; overall the production should feel soft-focus, candlelit, and deeply relaxed, with emotional power coming from calm invitation rather than big declaration."
  - title: "Sunrise"
    artist: "Norah Jones"
    description: "About the gentle domestic tenderness of waking up next to someone you love; light, breezy morning-after acoustic pop with jazzy softness, featuring a relaxed female vocal, gently strummed acoustic guitar, brushed or lightly tapped drums, warm bass, and subtle keys that create a lazy, sunlit groove; the song should feel easy and unforced, with a slight bossa or soft shuffle influence and a warm domestic intimacy; verses should feel conversational and playful, while the chorus should open into an airy, memorable refrain that feels like sunlight entering a room; lyrics should focus on tenderness, routine, and the gentle optimism of waking into love or peace, using simple domestic images rather than grand statements; melody should be supple and lightly syncopated, with emotional nuance carried by phrasing and tone; the overall effect should be smooth, warm, elegant, and quietly joyful, with a lived-in naturalism instead of glossy pop drama."
